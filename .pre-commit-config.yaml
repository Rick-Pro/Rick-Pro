# Secret scan before each commit (see SECURITY.md).
# Warn-only for now: findings are printed (values redacted) and the commit still goes through.
# One-time setup: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--exit-code=0"]
        verbose: true
